<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal Dash — apps built by Portal Dash.">
  <title>Portal Dash</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">Portal Dash</a>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Apps by Portal Dash</h1>
      <p>Simple, focused tools for everyday life. Browse our apps below.</p>
    </section>

    <section aria-labelledby="apps-heading">
      <h2 class="section-title" id="apps-heading">Apps</h2>
      <div class="app-grid">
        <a class="app-card" href="/keepthereceipt/">
          <img
            class="app-card__icon"
            src="/assets/keep-the-receipt-icon.png"
            alt="Keep the Receipt app icon"
            width="72"
            height="72"
          >
          <div>
            <h3 class="app-card__title">Keep the Receipt</h3>
            <p class="app-card__desc">
              Track return deadlines for your purchases and get reminders before it's too late.
            </p>
          </div>
          <span class="app-card__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer page">
    <p>&copy; <span id="year"></span> PortalDash LLC. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
